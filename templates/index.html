<!DOCTYPE html>
<html>
<head>
    <title>爆款标题生成器MVP</title>
    <style>
        body { max-width: 600px; margin: 20px auto; padding: 20px; }
        .result { margin-top: 20px; padding: 15px; background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>爆款标题生成器</h1>
    <form method="POST">
        <input type="text" name="keywords" placeholder="输入关键词（如：七夕礼物）" required 
               style="width: 300px; padding: 8px;">
        <select name="platform" style="padding: 8px;">
            <option value="douyin">抖音</option>
            <option value="xiaohongshu">小红书</option>
            <option value="zhihu">知乎</option>
        </select>
        <button type="submit" style="padding: 8px 20px;">立即生成</button>
    </form>

    {% if titles %}
    <div class="result">
        <h3>生成结果（{{ keywords }}）：</h3>
        <ol>
            {% for title in titles %}
            <li>{{ title }}</li>
            {% endfor %}
        </ol>
    </div>
    {% endif %}
</body>
</html>
